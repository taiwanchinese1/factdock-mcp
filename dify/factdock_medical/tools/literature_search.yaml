identity:
  name: literature_search
  author: factdock
  label:
    en_US: Search medical literature
description:
  human:
    en_US: "Search published medical and veterinary papers (titles, abstracts, journal, year and links). Uses API credits. Results are official records for professionals to check, not medical or veterinary advice."
  llm: "Searches published medical and veterinary literature by keywords, with optional year range and animal species hint. Returns titles, journal, year, identifiers and links. Reference data, not medical advice."
parameters:
  - name: query
    type: string
    required: true
    form: llm
    label:
      en_US: Keywords
    human_description:
      en_US: Search words, best in English.
    llm_description: Search keywords, preferably in English.

  - name: year_from
    type: number
    required: false
    form: llm
    label:
      en_US: From year
    human_description:
      en_US: Optional first year.
    llm_description: Optional first year, e.g. 2015.
  - name: year_to
    type: number
    required: false
    form: llm
    label:
      en_US: To year
    human_description:
      en_US: Optional last year.
    llm_description: Optional last year.

  - name: species_hint
    type: select
    required: false
    form: llm
    label:
      en_US: Animal species
    human_description:
      en_US: Optional animal species.
    llm_description: Optional animal species, only for veterinary questions.
    options:
      - value: dog
        label:
          en_US: Dog
      - value: cat
        label:
          en_US: Cat
      - value: rabbit
        label:
          en_US: Rabbit
      - value: cattle
        label:
          en_US: Cattle
      - value: pig
        label:
          en_US: Pig
      - value: horse
        label:
          en_US: Horse
      - value: chicken
        label:
          en_US: Chicken
      - value: sheep
        label:
          en_US: Sheep
      - value: goat
        label:
          en_US: Goat
      - value: ferret
        label:
          en_US: Ferret
      - value: bird
        label:
          en_US: Bird
      - value: fish
        label:
          en_US: Fish

  - name: limit
    type: number
    required: false
    default: 10
    min: 1
    max: 20
    form: form
    label:
      en_US: Number of results
    human_description:
      en_US: 1 to 20.
extra:
  python:
    source: tools/literature_search.py
